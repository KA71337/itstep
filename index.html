<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>С Днём учителя! ❤️</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html {
    min-height: 100%;
}

body {
    min-height: 100vh;
    min-height: 100svh;

    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255, 30, 70, 0.18),
            transparent 35%
        ),
        radial-gradient(
            circle at 0% 100%,
            rgba(110, 60, 255, 0.18),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #09090f,
            #130b18,
            #08080d
        );

    overflow-x: hidden;
}


/* =========================================
   BACKGROUND
========================================= */

.background {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 0;
}

.glow {
    position: absolute;
    width: 450px;
    height: 450px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: .20;
}

.glow.one {
    background: #ff1744;
    top: -220px;
    left: -180px;
}

.glow.two {
    background: #713cff;
    right: -200px;
    bottom: -200px;
}


/* =========================================
   MAIN
========================================= */

.page {
    position: relative;
    z-index: 2;

    min-height: 100vh;
    min-height: 100svh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 30px 18px;
}

.card {
    width: min(760px, 100%);

    padding:
        clamp(35px, 7vw, 65px)
        clamp(22px, 6vw, 60px);

    text-align: center;

    border-radius: 32px;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.10);

    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);

    box-shadow:
        0 30px 100px rgba(0,0,0,.45),
        inset 0 1px 0 rgba(255,255,255,.08);

    animation: cardAppear .8s ease;
}

@keyframes cardAppear {
    from {
        opacity: 0;
        transform: translateY(25px) scale(.97);
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1);
    }
}


/* =========================================
   HEART
========================================= */

.heart {
    width: 78px;
    height: 78px;

    margin: 0 auto 25px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 38px;

    border-radius: 24px;

    background:
        linear-gradient(
            145deg,
            rgba(255,30,70,.24),
            rgba(255,30,70,.07)
        );

    border: 1px solid rgba(255,90,120,.25);

    box-shadow:
        0 15px 50px rgba(255,20,70,.18);
}


/* =========================================
   TEXT
========================================= */

h1 {
    font-size: clamp(34px, 6vw, 58px);
    line-height: 1.05;

    letter-spacing: -2px;

    font-weight: 850;

    margin-bottom: 20px;

    background:
        linear-gradient(
            135deg,
            #ffffff,
            #ffdce4 50%,
            #ff4c70
        );

    -webkit-background-clip: text;
    background-clip: text;

    color: transparent;
}

.subtitle {
    color: rgba(255,255,255,.70);

    font-size: clamp(17px, 3vw, 22px);

    line-height: 1.55;

    margin-bottom: 25px;
}

.names {
    display: inline-block;

    padding: 12px 20px;

    border-radius: 15px;

    background: rgba(255,255,255,.055);

    border: 1px solid rgba(255,255,255,.09);

    font-size: clamp(18px, 3.5vw, 26px);

    font-weight: 750;
}


/* =========================================
   QUESTION
========================================= */

.question {
    margin-top: 38px;
}

.question h2 {
    font-size: clamp(23px, 4vw, 32px);

    font-weight: 800;

    margin-bottom: 10px;
}

.question p {
    color: rgba(255,255,255,.52);

    font-size: 16px;

    margin-bottom: 25px;
}


/* =========================================
   YES / NO BUTTONS
========================================= */

.answers {
    display: flex;

    justify-content: center;

    gap: 14px;

    width: 100%;
}

.answer {
    flex: 1;

    max-width: 220px;

    min-height: 62px;

    border: 1px solid rgba(255,255,255,.10);

    border-radius: 17px;

    color: white;

    font-size: 18px;

    font-weight: 800;

    cursor: pointer;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.answer:hover {
    transform: translateY(-3px);
}

.answer.yes {
    background:
        linear-gradient(
            135deg,
            #ff1744,
            #e00035
        );

    box-shadow:
        0 12px 30px rgba(255,20,65,.25);
}

.answer.no {
    background: rgba(255,255,255,.07);
}

.answer.no:hover {
    background: rgba(255,255,255,.11);
}


/* =========================================
   AFTER ANSWER
========================================= */

.after-answer {
    display: none;

    margin-top: 30px;

    animation: answerAppear .6s ease;
}

.after-answer.show {
    display: block;
}

@keyframes answerAppear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.after-title {
    font-size: 19px;

    color: rgba(255,255,255,.75);

    margin-bottom: 17px;
}


/* =========================================
   RED BUTTON
========================================= */

.start-button {
    position: relative;

    width: min(440px, 100%);

    min-height: 70px;

    border: none;

    border-radius: 19px;

    cursor: pointer;

    overflow: hidden;

    color: white;

    font-size: clamp(17px, 3vw, 21px);

    font-weight: 850;

    background:
        linear-gradient(
            135deg,
            #ff1744,
            #d90032
        );

    box-shadow:
        0 18px 45px rgba(255,20,65,.34),
        inset 0 1px 0 rgba(255,255,255,.20);

    transition:
        transform .2s ease,
        box-shadow .2s ease;
}

.start-button:hover {
    transform: translateY(-4px);

    box-shadow:
        0 24px 55px rgba(255,20,65,.44),
        inset 0 1px 0 rgba(255,255,255,.20);
}

.start-button:active {
    transform: scale(.97);
}

.button-content {
    position: relative;
    z-index: 2;
}

.button-shine {
    position: absolute;
    inset: 0;

    background:
        linear-gradient(
            110deg,
            transparent 30%,
            rgba(255,255,255,.22),
            transparent 70%
        );

    transform: translateX(-100%);

    animation: shine 3s infinite;
}

@keyframes shine {

    0%,
    55% {
        transform: translateX(-100%);
    }

    75%,
    100% {
        transform: translateX(100%);
    }
}

.hint {
    margin-top: 15px;

    font-size: 13px;

    color: rgba(255,255,255,.38);
}


/* =========================================
   VIDEO CONTAINER
========================================= */

.video-section {
    position: relative;
    z-index: 5;

    display: none;

    width: 100%;

    min-height: 100vh;
    min-height: 100svh;

    padding:
        clamp(20px, 4vw, 50px)
        clamp(15px, 5vw, 60px);

    align-items: center;
    justify-content: center;
}

.video-section.show {
    display: flex;

    animation: videoAppear .8s ease;
}

@keyframes videoAppear {
    from {
        opacity: 0;
        transform: scale(.96);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

.video-wrapper {
    position: relative;

    width: min(1100px, 100%);

    /*
       Большое видео,
       но НЕ на весь экран
    */
    max-height: 78vh;

    border-radius: 28px;

    overflow: hidden;

    background: #050505;

    box-shadow:
        0 35px 100px rgba(0,0,0,.65),
        0 0 0 1px rgba(255,255,255,.08);

    aspect-ratio: 16 / 9;
}

.video-wrapper video {
    display: block;

    width: 100%;
    height: 100%;

    object-fit: contain;

    background: #000;

    border: none;
    outline: none;
}


/* =========================================
   CONFETTI
========================================= */

.confetti {
    position: fixed;

    top: -20px;

    width: 8px;
    height: 14px;

    z-index: 100;

    pointer-events: none;

    animation: fall linear forwards;
}

@keyframes fall {

    from {
        transform:
            translateY(-30px)
            rotate(0deg);
    }

    to {
        transform:
            translateY(110vh)
            rotate(720deg);
    }
}


/* =========================================
   MOBILE
========================================= */

@media (max-width: 600px) {

    .page {
        padding: 16px;
    }

    .card {
        border-radius: 25px;

        padding:
            34px 19px;
    }

    .heart {
        width: 65px;
        height: 65px;

        font-size: 32px;

        border-radius: 20px;

        margin-bottom: 20px;
    }

    h1 {
        letter-spacing: -1px;
    }

    .question {
        margin-top: 28px;
    }

    .answers {
        gap: 10px;
    }

    .answer {
        min-height: 58px;

        font-size: 16px;

        border-radius: 15px;
    }

    .video-section {
        padding: 20px 12px;
    }

    .video-wrapper {
        width: 100%;

        border-radius: 22px;

        /*
          На телефоне видео всё равно
          остаётся крупным, но с отступами
        */
        max-height: 72vh;
    }
}


/* =========================================
   VERY SMALL PHONES
========================================= */

@media (max-width: 380px) {

    .answers {
        flex-direction: column;
        align-items: center;
    }

    .answer {
        width: 100%;
        max-width: none;
    }
}


/* =========================================
   REDUCED MOTION
========================================= */

@media (prefers-reduced-motion: reduce) {

    *,
    *::before,
    *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
    }
}

</style>
</head>


<body>

<!-- Background -->
<div class="background">
    <div class="glow one"></div>
    <div class="glow two"></div>
</div>


<!-- =========================================
     FIRST SCREEN
========================================= -->

<main class="page" id="mainPage">

    <section class="card">

        <div class="heart">
            ❤️
        </div>


        <h1>
            С Днём учителя!
        </h1>


        <div class="subtitle">
            Дорогой Сянан Меллим,<br>
            поздравляем Вас с этим прекрасным днём! 🥳
        </div>


        <div class="names">
            От Кямиля и Рауля ❤️
        </div>


        <!-- QUESTION -->

        <div class="question">

            <h2>
                🎁 Дадите нам 50 кристаллов?
            </h2>

            <p>
                Мы очень старались... 🥺
            </p>


            <div class="answers">

                <button
                    class="answer yes"
                    id="yesButton"
                >
                    ДА ❤️
                </button>


                <button
                    class="answer no"
                    id="noButton"
                >
                    НЕТ 😭
                </button>

            </div>


            <!-- Appears after answer -->

            <div
                class="after-answer"
                id="afterAnswer"
            >

                <div class="after-title">
                    😏 Мы так и знали...
                </div>


                <button
                    class="start-button"
                    id="startButton"
                >

                    <span class="button-content">
                        🔴 НАЖМИТЕ НА КНОПКУ
                    </span>

                    <span class="button-shine"></span>

                </button>


                <div class="hint">
                    ↓ нажмите на кнопку ↓
                </div>

            </div>

        </div>

    </section>

</main>


<!-- =========================================
     VIDEO
========================================= -->

<section
    class="video-section"
    id="videoSection"
>

    <div class="video-wrapper">

        <video
            id="mainVideo"
            src="video.mp4"
            playsinline
            preload="auto"
        ></video>

    </div>

</section>


<!-- AUDIO -->

<audio
    id="voice"
    src="ozvuchka.mp3"
    preload="auto"
></audio>


<script>

const yesButton =
    document.getElementById("yesButton");

const noButton =
    document.getElementById("noButton");

const afterAnswer =
    document.getElementById("afterAnswer");

const startButton =
    document.getElementById("startButton");

const voice =
    document.getElementById("voice");

const mainPage =
    document.getElementById("mainPage");

const videoSection =
    document.getElementById("videoSection");

const video =
    document.getElementById("mainVideo");


let answered = false;
let started = false;


/* =========================================
   ANSWER
========================================= */

function answerQuestion(answer) {

    if (answered) return;

    answered = true;


    // Показываем следующий этап
    afterAnswer.classList.add("show");


    // Убираем варианты ответа
    yesButton.style.display = "none";
    noButton.style.display = "none";


    // Меняем текст в зависимости от ответа
    const title =
        afterAnswer.querySelector(".after-title");


    if (answer === "yes") {

        title.textContent =
            "❤️ Спасибо! Мы знали, что Вы добрый!";

    } else {

        title.textContent =
            "🥺 Ну пожалуйста... хотя бы нажмите сюда!";

    }

}


/* =========================================
   YES / NO
========================================= */

yesButton.addEventListener("click", () => {

    answerQuestion("yes");

});


noButton.addEventListener("click", () => {

    answerQuestion("no");

});


/* =========================================
   RED BUTTON
========================================= */

startButton.addEventListener("click", async () => {

    if (started) return;

    started = true;

    startButton.disabled = true;

    startButton.querySelector(
        ".button-content"
    ).textContent = "❤️ Сейчас...";


    createConfetti();


    try {

        voice.currentTime = 0;

        await voice.play();

    } catch (error) {

        console.log(
            "Не удалось запустить MP3:",
            error
        );

        showVideo();

    }

});


/* =========================================
   AUDIO ENDED
========================================= */

voice.addEventListener("ended", () => {

    showVideo();

});


/* =========================================
   SHOW VIDEO
========================================= */

async function showVideo() {

    /*
       Убираем первый экран
    */

    mainPage.style.display = "none";


    /*
       Показываем видео
    */

    videoSection.classList.add("show");


    /*
       Начинаем с начала
    */

    video.currentTime = 0;


    try {

        await video.play();

    } catch (error) {

        console.log(
            "Autoplay заблокирован браузером:",
            error
        );

        /*
           Обычно после нажатия пользователя
           autoplay должен работать.
        */

        video.muted = true;

        try {

            await video.play();

        } catch (e) {

            console.log(
                "Видео не удалось автоматически запустить:",
                e
            );

        }

    }

}


/* =========================================
   CONFETTI
========================================= */

function createConfetti() {

    const colors = [
        "#ff1744",
        "#ff4569",
        "#ffffff",
        "#ffd166",
        "#7c3aed"
    ];


    for (let i = 0; i < 90; i++) {

        const piece =
            document.createElement("div");


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 + "vw";


        piece.style.background =
            colors[
                Math.floor(
                    Math.random() * colors.length
                )
            ];


        piece.style.animationDuration =
            (2 + Math.random() * 3) + "s";


        piece.style.animationDelay =
            Math.random() * .6 + "s";


        piece.style.transform =
            `rotate(${Math.random() * 360}deg)`;


        document.body.appendChild(piece);


        setTimeout(() => {

            piece.remove();

        }, 5500);

    }

}

</script>

</body>
</html>
